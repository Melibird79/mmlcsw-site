<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Melissa McKenna, LCSW · Mini-course</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..600&family=Karla:wght@400;600;700&display=swap">
<link rel="stylesheet" href="player.css">
</head>
<body>
<a class="skip" href="#stage">Skip to the course</a>
<header class="top" id="top">
  <div class="brand"><svg class="mark" viewBox="0 0 80 88" aria-hidden="true"><path d="M8 84 V42 A16 16 0 0 1 40 42 V84 M40 84 V42 A16 16 0 0 1 72 42 V84" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="12" r="5" fill="#E9A63B"/></svg><span class="brand-name">Melissa McKenna, LCSW</span></div>
  <div class="top-right"><button id="where" class="where" type="button"></button><button class="link" id="btnPrivacy" type="button">Privacy</button></div>
</header>
<div class="progress" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div>
<main id="stage" tabindex="-1"></main>
<nav class="nav" id="nav" aria-label="Course navigation">
  <button class="btn ghost" id="prev" type="button">Back</button>
  <span id="count" aria-live="polite"></span>
  <button class="btn" id="next" type="button">Next</button>
</nav>
<button class="pause" id="btnPause" type="button" aria-haspopup="dialog">Pause</button>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal-card"><button class="modal-x" id="modalX" type="button" aria-label="Close">&times;</button><div id="modalBody"></div></div>
</div>
<noscript><p style="padding:24px">This course needs JavaScript. Please open it in a current browser.</p></noscript>
<script src="player.js"></script>
</body>
</html>
